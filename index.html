<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChronoMap V18</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif}
#map{position:absolute;inset:0}.panel{background:#fffE;padding:8px;border-radius:10px;box-shadow:0 2px 12px #0003}
#top{position:absolute;z-index:1000;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap}
#bottom{position:absolute;z-index:1000;left:12px;right:12px;bottom:12px}
button,input{font:inherit}button{padding:8px 10px;border:0;border-radius:7px}button.active{background:#222;color:#fff}
#search{width:220px}#timeline{width:100%}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
 <div class="panel"><input id="search" placeholder="Rechercher une ville…"><button id="go">Rechercher</button></div>
 <div class="panel">
  <button class="mode active" data-mode="carte">🗺️ Carte</button>
  <button class="mode" data-mode="relief">⛰️ Relief</button>
  <button class="mode" data-mode="satellite">🛰️ Satellite</button>
 </div>
</div>
<div id="bottom" class="panel">
 <div><button id="prev">◀</button><button id="play">▶</button><button id="next">▶</button>
 <b id="year">2026</b></div>
 <input id="timeline" type="range" min="-3000" max="2026" value="2026" step="1">
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
<script src="https://unpkg.com/@openhistoricalmap/maplibre-gl-dates@1.4.0/index.js"></script>
<script>
const map=L.map('map').setView([43.949,4.805],13);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'});
const relief=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{attribution:'© OpenTopoMap'});
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri'});
let ohm=null,playing=false;

function removeOHM(){if(ohm){map.removeLayer(ohm);ohm=null}}
function filterDate(){
 if(!ohm)return;
 const gl=ohm.getMaplibreMap(), y=+timeline.value;
 if(gl&&typeof gl.filterByDate==='function'){
  const d=y<0?Math.abs(y).toString().padStart(4,'0')+'-01-01':y+'-12-31';
  try{gl.filterByDate(d)}catch(e){}
 }
}
function addOHM(opacity){
 removeOHM();
 ohm=L.maplibreGL({style:'https://www.openhistoricalmap.org/map-styles/main/main.json',opacity,interactive:false}).addTo(map);
 ohm.on('load',filterDate); ohm.on('styledata',filterDate);
}
function setMode(m){
 document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
 [street,relief,satellite].forEach(l=>{try{map.removeLayer(l)}catch(e){}});
 removeOHM();
 if(m==='carte')addOHM(1);
 if(m==='relief'){relief.addTo(map);addOHM(.72)}
 if(m==='satellite')satellite.addTo(map);
}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function setYear(y){
 y=Math.max(-3000,Math.min(2026,Math.round(y)));timeline.value=y;
 year.textContent=y<0?Math.abs(y)+' av. J.-C.':y;filterDate();
}
timeline.oninput=e=>setYear(e.target.value);
prev.onclick=()=>setYear(+timeline.value-10);next.onclick=()=>setYear(+timeline.value+10);
play.onclick=()=>{
 playing=!playing;play.textContent=playing?'⏸':'▶';
 if(playing)(function tick(){if(!playing)return;setYear(+timeline.value+5);if(+timeline.value>=2026){playing=false;play.textContent='▶';return}setTimeout(tick,500)})();
};
async function search(){
 const q=search.value.trim();if(!q)return;
 try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q));
 const a=await r.json();if(a[0])map.setView([+a[0].lat,+a[0].lon],14)}catch(e){}
}
go.onclick=search;search.onkeydown=e=>{if(e.key==='Enter')search()};
setMode('carte');
</script>
</body></html>
