<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChronoMap V18</title>
<style>body{margin:0;background:#07101f;color:#fff;font-family:system-ui;text-align:center;padding:40px}button{padding:14px 20px;border:0;border-radius:10px;background:#4b8cff;color:white;font-weight:800;font-size:16px}p{color:#a9b9ca}</style>
</head><body>
<h2>ChronoMap V18</h2><p>Chargement de la version ChronoMap avec 3 modes séparés et évolution par la frise…</p>
<button id="retry">Charger ChronoMap</button>
<script>
const RAW='https://raw.githubusercontent.com/giovanni-trevisan/ChronoMap/main/';
async function load(){
  try{
    let s=await fetch(RAW+'index.html',{cache:'no-store'}).then(r=>r.text());
    const oldMode=`function setMapMode(mode){
  currentMapMode=mode;
  [streetLayer,reliefLayer,satelliteLayer].forEach(l=>map.removeLayer(l));
  (mode==='satellite'?satelliteLayer:mode==='relief'?reliefLayer:streetLayer).addTo(map);
  if(typeof renderHistoricalMap==='function' && data){ const y=+$('timeline').value,p=place(); if(p)renderHistoricalMap(p,y); }
  const labels={street:'🗺️ Carte',relief:'⛰️ Relief',satellite:'🛰️ Satellite'};
  document.querySelectorAll('.chronomap-map-control [data-map-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mapMode===mode));
}`;
    const newMode=`function setMapMode(mode){
  currentMapMode=mode;
  [streetLayer,reliefLayer,satelliteLayer].forEach(l=>map.removeLayer(l));
  (mode==='satellite'?satelliteLayer:mode==='relief'?reliefLayer:streetLayer).addTo(map);
  // Les trois fonds restent strictement séparés. La progression historique
  // est conservée en Carte et Relief, mais aucune couche historique raster
  // n'est injectée dans Satellite.
  if(typeof historicalSources!=='undefined'){
    Object.values(historicalSources||{}).forEach(l=>map.removeLayer(l));
  }
  if(typeof setHistoricalSource==='function' && mode!=='satellite' && data){
    setHistoricalSource(+$('timeline').value);
  }
  if(typeof renderHistoricalMap==='function' && data){
    const y=+$('timeline').value,p=place();
    if(p)renderHistoricalMap(p,y);
  }
  const labels={street:'🗺️ Carte',relief:'⛰️ Relief',satellite:'🛰️ Satellite'};
  document.querySelectorAll('.chronomap-map-control [data-map-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mapMode===mode));
}`;
    if(s.includes(oldMode)) s=s.replace(oldMode,newMode);
    const marker=`function renderHistoricalMap(p,y){
  historicalVectorLayer.clearLayers();
  if(!p)return;`;
    const repl=`function renderHistoricalMap(p,y){
  historicalVectorLayer.clearLayers();
  if(!p)return;
  // V18 : le moteur historique vectoriel est commun à Carte et Relief.
  // Le fond de carte reste indépendant : seule l'histoire évolue avec la frise.`;
    if(s.includes(marker)) s=s.replace(marker,repl);
    // Force Satellite to remain a clean satellite basemap by suppressing
    // raster historical sources when the selected mode is satellite.
    const inject=`\n<script>\n(function(){\n  const originalSetMapMode=window.setMapMode;\n  // Keep a visible mode badge and prevent accidental cross-mode raster layers.\n  window.addEventListener('load',function(){\n    try{ if(window.currentMapMode==='satellite' && typeof window.historicalSources!=='undefined'){Object.values(window.historicalSources||{}).forEach(l=>window.map&&window.map.removeLayer(l));} }catch(e){}\n  });\n})();\n<\\/script>\n`;
    s=s.replace('</body>',inject+'</body>');
    // Ensure relative assets resolve against the repository when this launcher is opened locally.
    s=s.replace('<head>','<head><base href="'+RAW+'">');
    document.open();document.write(s);document.close();
  }catch(e){
    document.body.innerHTML='<h2>Chargement impossible</h2><p>Vérifie ta connexion Internet puis réessaie.</p><button onclick="location.reload()">Réessayer</button>';
    console.error(e);
  }
}
document.getElementById('retry').onclick=load;load();
</script>
</body></html>
